<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Air Flow Simulator</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>Air Flow Simulator</h1>
    <p class="status" id="save-status"></p>
  </header>

  <main class="app">
    <nav class="toolbar" aria-label="Tools">
      <div class="group" role="group" aria-label="Drawing tools">
        <button type="button" data-tool="select" title="Select and move (S)">Select</button>
        <button type="button" data-tool="room" title="Drag a rectangle of walls (B)">Room</button>
        <button type="button" data-tool="wall" title="Drag a single wall (W)">Wall</button>
        <button type="button" data-tool="window" title="Click a wall to add a window (N)">Window</button>
        <button type="button" data-tool="door" title="Click a wall to add a door (D)">Door</button>
        <button type="button" data-tool="fan" title="Click inside a room to add a fan (F)">Fan</button>
        <button type="button" data-tool="erase" title="Click something to delete it (E)">Erase</button>
      </div>
      <div class="group" role="group" aria-label="History">
        <button type="button" id="undo" title="Undo (Cmd/Ctrl+Z)">Undo</button>
        <button type="button" id="redo" title="Redo (Cmd/Ctrl+Shift+Z)">Redo</button>
      </div>
      <div class="group" role="group" aria-label="File">
        <button type="button" id="new" title="Start an empty plan">New</button>
        <button type="button" id="open" title="Open a layout file">Open file</button>
        <button type="button" id="save" title="Download this layout as a file">Save file</button>
        <input type="file" id="file-input" accept=".json,application/json" hidden>
      </div>
    </nav>

    <section class="stage">
      <canvas id="plan" aria-label="Floor plan editor"></canvas>
      <p id="status" class="status-bar" role="status"></p>
      <ul id="warnings" class="warnings"></ul>
    </section>

    <div class="side">
      <aside id="controls" class="props" aria-label="Simulation and conditions"></aside>
      <aside id="props" class="props" aria-label="Selected item"></aside>
    </div>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
